name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-test-
      # The CRS corpus is a separate job: it needs a checkout of the rule set
      # and is worth running optimised. Skipping it here keeps this job fast
      # rather than leaving it unrun — see the `conformance` job below.
      - run: cargo test --all-targets
        env:
          SKIP_CRS_CONFORMANCE: 1
      - run: cargo test --doc

  conformance:
    name: OWASP CRS conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-conformance-${{ hashFiles('Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-conformance-
      # Pinned: the gate compares the pass count for an exact match, so the
      # corpus must not move under it. Bump the commit and MIN_PASSING in
      # tests/crs_conformance.rs together.
      - name: Fetch OWASP CRS
        env:
          CRS_COMMIT: 30cb436b261a9f5ec32a5a0677e17f3cfa1a8739
        run: |
          mkdir -p test-rules/crs
          git -C test-rules/crs init -q
          git -C test-rules/crs fetch -q --depth 1 https://github.com/coreruleset/coreruleset.git "$CRS_COMMIT"
          git -C test-rules/crs checkout -q FETCH_HEAD
          cp test-rules/crs/crs-setup.conf.example test-rules/crs/crs-setup.conf
          git -C test-rules/crs log -1 --format='CRS %h %ci'
      # Release: ~14s against the corpus, versus minutes unoptimised. This job
      # must not set SKIP_CRS_CONFORMANCE — that is what makes the gate real.
      - run: cargo test --release --test crs_conformance -- --nocapture
